name: Docker Image CI halo

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 必须赋予权限才能将镜像推送到仓库
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 第一步：登录到 GitHub Container Registry
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }} # 使用当前执行 Action 的用户名
        password: ${{ secrets.GITHUB_TOKEN }} # 使用自动生成的临时口令

    # 第二步：构建并推送镜像
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true # 设为 true 才会执行推送操作
        # 镜像名称规范：ghcr.io/用户名/仓库名:标签
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.sha }}
